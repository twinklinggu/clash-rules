name: Generate RULE-SET for Premium Edition of Clash

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          # 自动获取 GitHub Release 最新的 mihomo 二进制
          MIHOMO_URL=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.gz$")) | .browser_download_url' | head -n 1) \
          && curl -sSL "$MIHOMO_URL" | gzip -d > /tmp/mihomo \
          && sudo mv /tmp/mihomo /usr/local/bin/mihomo \
          && sudo chmod +x /usr/local/bin/mihomo \
          && mihomo -v

      - name: Set Variables
        shell: bash
        run: |
          echo "TIMESTAMP=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "DERP_URL=https://login.tailscale.com/derpmap/default" >> $GITHUB_ENV

      - name: Fetch and Process DERP Data
        shell: bash
        run: |
          curl -sSL ${{ env.DERP_URL }} > derp.json
          
          # 生成带 /32 掩码的 IP/CIDR 规则列表
          echo "payload:" > tsderpcidr.yaml
          jq -r '.Regions[].Nodes[]?.IPv4 | select(. != null)' derp.json | sed 's/^/  - "/; s/$/\/32"/' >> tsderpcidr.yaml
          
          # 生成域名规则列表
          echo "payload:" > tsderp.yaml
          jq -r '.Regions[].Nodes[]?.HostName | select(. != null)' derp.json | sed 's/^/  - /' >> tsderp.yaml
          
          mkdir -p publish
          # 将当前目录下的所有 .yaml（含动态生成的及仓库自带的）移动或复制到 publish 目录
          mv *.yaml publish/ 2>/dev/null || true

      - name: Batch Convert All YAML to MRS with Mihomo
        shell: bash
        run: |
          set -euo pipefail
          
          for file in ./publish/*.yaml; do
            [ -e "$file" ] || continue
            
            filename=$(basename "$file" .yaml)
            output_mrs="./publish/${filename}.mrs"
            
            # 根据文件名特征判断格式，包含 ip 或 cidr 走 ipcidr，其余统一走 domain
            if [[ "$filename" =~ (ip|cidr) ]]; then
              behavior="ipcidr"
            else
              behavior="domain"
            fi

            echo "Compiling $file -> $output_mrs (behavior: $behavior)..."
            mihomo convert-ruleset "$behavior" yaml "$file" "$output_mrs"
          done

      - name: Deploy to Release Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish
          branch: release
          commit-message: "Update DERP & MRS rules: ${{ env.TIMESTAMP }}"
          clean: true
