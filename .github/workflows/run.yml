name: Generate RULE-SET for Premium Edition of Clash

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    
    steps:
      - name: Install Runtime Dependencies
        run: apk add --no-cache jq curl github-cli git bash rsync

      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set Variables
        shell: bash
        run: |
          echo "TIMESTAMP=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "DERP_URL=https://login.tailscale.com/derpmap/default" >> $GITHUB_ENV

      - name: Fetch and Process DERP Data
        shell: bash
        run: |
          curl -sSL ${{ env.DERP_URL }} > derp.json
          
          echo "payload:" > tsderpcidr.txt
          jq -r '.Regions[].Nodes[]?.IPv4 | select(. != null)' derp.json | sed 's/^/  - "/; s/$/\/32"/' >> tsderpcidr.txt
          
          echo "payload:" > tsderp.txt
          jq -r '.Regions[].Nodes[]?.HostName | select(. != null)' derp.json | sed 's/^/  - /' >> tsderp.txt
          
          mkdir -p publish
          mv *.txt publish/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install Compiler
        run: go install github.com/MetaCubeX/meta-rules-dat/cmd/meta-rules-dat@latest

      - name: Build MRS
        run: |
          for f in ./publish/*.txt; do
            meta-rules-dat convert -i "$f" -o "./publish/$(basename "${f%.txt}.mrs")" -b domain
          done

      - name: Deploy to Release Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish
          branch: release
          commit-message: "Update DERP rules: ${{ env.TIMESTAMP }}"
          clean: true
